# This is a Declarative Automation Bundle definition for enterprise_data_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: enterprise_data_pipeline
  uuid: 05416dbd-b1af-46d1-acde-d4921f726843

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8c1b4cff-5fa8.cloud.databricks.com
      root_path: /Workspace/Users/alkeshnagar56@gmail.com/.bundle/enterprise_data_pipeline/${bundle.target}
    variables:
      catalog: project_work
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-8c1b4cff-5fa8.cloud.databricks.com
    variables:
      catalog: project_work
      schema: prod
